    (function () {

      var snow = document.getElementById("ec-snow");
      var seed = 77;
      function rnd() {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      }
      var flakes = [];
      for (var i = 0; i < 46; i++) {
        var f = document.createElement("i");
        snow.appendChild(f);
        flakes.push({ el: f, x: rnd() * 1920, y: rnd() * 1080, v: 40 + rnd() * 50, s: 0.5 + rnd() * 0.8 });
      }
      var tl = gsap.timeline({ paused: true });
      var clock = { t: 0 };
      tl.to(clock, {
        t: 7.6,
        duration: 7.6,
        ease: "none",
        onUpdate: function () {
          for (var i = 0; i < flakes.length; i++) {
            var F = flakes[i];
            var y = (F.y + clock.t * F.v) % 1100;
            var x = F.x + Math.sin(clock.t * 0.8 + i) * 14;
            F.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) scale(" + F.s + ")";
