<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      pointer-events: none;
      font-family: var(--font-display, "Outfit"), sans-serif;
    }
    .ti-block {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 1300px;
      height: 620px;
    }
    .ti-scrim {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 62% 58% at 20% 80%, rgba(14, 24, 46, 0.62) 0%, rgba(14, 24, 46, 0) 100%);
      opacity: 0;
    }
    .ti-scrim.light {
      background: radial-gradient(ellipse 62% 58% at 20% 80%, rgba(255, 244, 234, 0.72) 0%, rgba(255, 244, 234, 0) 100%);
    }
    .ti-text {
      position: absolute;
      left: 150px;

      color: var(--color-ink, #ffffff);

      letter-spacing: -0.02em;
      text-shadow: 0 6px 28px rgba(12, 22, 44, 0.45);
      white-space: nowrap;
    }
    .ti-text.dark {
      color: #1e3354;
      text-shadow: none;
    }
    .ti-text .w,
    .ti-text .l {
      display: inline-block;
      opacity: 0;
    }
    .ti-text .acc {
      color: var(--color-accent, #f2b33d);
    }
    .ti-text.dark .acc {
      color: var(--color-brand, #d7263d);
    }
    .ti-line {
      display: block;
    }
  </style>
  <div id="root" data-composition-id="titles" data-width="1920" data-height="1080" data-layout-allow-overlap>
    <div id="ti-night" class="ti-block clip" data-start="5.4" data-duration="3.55" data-track-index="0">
      <div class="ti-scrim"></div>
      <div class="ti-text">
        <span class="ti-line"><span class="w">Une</span> <span class="w">nuit.</span></span>
        <span class="ti-line acc split">Zéro retard.</span>
      </div>
    </div>
    <div id="ti-read" class="ti-block clip" data-start="14.1" data-duration="2.95" data-track-index="1">
      <div class="ti-scrim"></div>
      <div class="ti-text"><span class="w">Lire.</span> <span class="w acc">Trier.</span></div>
    </div>
    <div id="ti-wrap" class="ti-block clip" data-start="17.7" data-duration="2.75" data-track-index="2">
      <div class="ti-scrim"></div>
      <div class="ti-text"><span class="split">Emballer.</span></div>
    </div>
    <div id="ti-load" class="ti-block clip" data-start="21.45" data-duration="1.95" data-track-index="3">
      <div class="ti-scrim"></div>
      <div class="ti-text"><span class="w">Charger.</span></div>
    </div>
    <div id="ti-route" class="ti-block clip" data-start="23.7" data-duration="3.0" data-track-index="4">
      <div class="ti-scrim"></div>
      <div class="ti-text"><span class="split acc">Optimiser.</span></div>
    </div>
    <div id="ti-dawn" class="ti-block clip" data-start="35.0" data-duration="2.75" data-track-index="5">
      <div class="ti-scrim light"></div>
      <div class="ti-text dark">
        <span class="ti-line"><span class="w">Avant</span> <span class="w acc">7 h.</span></span>
        <span class="ti-line"><span class="w">Sous</span> <span class="w">le</span> <span class="w">sapin.</span></span>
      </div>
    </div>
  </div>
  <script>
    (function () {
      // split .split spans into letters once at init (not timed elements)
      document.querySelectorAll("#root .split").forEach(function (el) {
        var txt = el.textContent;
        el.textContent = "";
        for (var i = 0; i < txt.length; i++) {
          var s = document.createElement("span");
          s.className = "l";
          s.textContent = txt[i] === " " ? " " : txt[i];
          el.appendChild(s);
        }
      });
      var tl = gsap.timeline({ paused: true });
      function block(id, start, dur, entries) {
        var root = document.getElementById(id);
        var scrim = root.querySelector(".ti-scrim");
        tl.fromTo(scrim, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, start);
        entries.forEach(function (e) {
          var els = root.querySelectorAll(e.sel);
          if (e.kind === "word")
            tl.fromTo(els, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.075, ease: "power4.out" }, start + e.at);
          else if (e.kind === "letter")
            tl.fromTo(els, { opacity: 0.0, filter: "blur(5px)", y: 0 }, { opacity: 1, filter: "blur(0px)", duration: 0.14, stagger: 0.04, ease: "power3.out" }, start + e.at);
          else if (e.kind === "line")
            tl.fromTo(els, { opacity: 0, filter: "blur(12px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, start + e.at);
        });
        var end = start + dur;
        tl.to(root.querySelectorAll(".w, .l"), { opacity: 0, filter: "blur(8px)", duration: 0.18, stagger: 0.02, ease: "power2.in" }, end - 0.32);
        tl.to(scrim, { opacity: 0, duration: 0.25, ease: "power2.in" }, end - 0.3);
      }
      block("ti-night", 5.4, 3.55, [
        { sel: ".ti-line:first-child .w", kind: "word", at: 0.0 },
        { sel: ".split .l", kind: "letter", at: 0.9 },
      ]);
      block("ti-read", 14.1, 2.95, [
        { sel: ".w:first-child", kind: "line", at: 0.0 },
        { sel: ".w.acc", kind: "line", at: 0.85 },
      ]);
      block("ti-wrap", 17.7, 2.75, [{ sel: ".l", kind: "letter", at: 0.0 }]);
      block("ti-load", 21.45, 1.95, [{ sel: ".w", kind: "line", at: 0.0 }]);
      block("ti-route", 23.7, 3.0, [{ sel: ".l", kind: "letter", at: 0.0 }]);
      block("ti-dawn", 35.0, 2.75, [
        { sel: ".ti-line:first-child .w", kind: "word", at: 0.0 },
        { sel: ".ti-line:last-child .w", kind: "word", at: 0.55 },
      ]);
      window.__timelines = window.__timelines || {};
      window.__timelines["titles"] = tl;
    })();
  </script>
