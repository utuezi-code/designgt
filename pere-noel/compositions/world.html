<!doctype html>
<!--
  World: the whole isometric world of « Père Noël & Cie » in one continuous take.
  Town (Léa's street) → North Pole HQ (sort, wrap) → sleigh + optimised route → Léa's house in cutaway.
  Seek-safe: every frame is render(t), driven by one linear GSAP clock; all randomness is seeded.
-->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #22395e;
      }
      #world {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: "Outfit", sans-serif;
      }
      #w-sky {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 75% 70% at 50% 42%, #3a5a8c 0%, #1e3354 100%);
      }
      #w-dawn {
        position: absolute;
        inset: 0;
        opacity: 0;
        background: radial-gradient(ellipse 75% 70% at 50% 42%, #ffd8b8 0%, #ec9c88 100%);
      }
      #w-canvas,
      #w-leaders {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        display: block;
      }
      .w-label {
        position: absolute;
        left: 0;
        top: 0;
        color: #ffffff;
        font-weight: 600;
        font-size: 40px;
        line-height: 1.15;
        white-space: nowrap;
        text-shadow: 0 2px 10px rgba(10, 20, 40, 0.6);
        opacity: 0;
      }
      .w-label b {
        font-weight: 800;
        color: #f2b33d;
      }
      .w-label small {
        display: block;
        font-size: 32px;
        font-weight: 500;
        opacity: 0.92;
      }
      #w-leaders line {
        stroke: #ffffff;
        stroke-width: 2.5;
      }
      #w-leaders circle {
        fill: #f2b33d;
        stroke: #ffffff;
        stroke-width: 2.5;
      }
      #w-flood {
        position: absolute;
        inset: 0;
        background: #d7263d;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="world"
      data-composition-id="world"
      data-start="0"
      data-duration="38.4"
      data-width="1920"
      data-height="1080"
      data-layout-allow-overflow
    >
      <div id="w-sky"></div>
      <div id="w-dawn"></div>
      <canvas id="w-canvas" class="clip" data-start="0" data-duration="38.4" data-track-index="1"></canvas>
      <svg id="w-leaders" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
      <div id="w-labels">
        <div class="w-label" id="lb-lea">Léa, 7 ans<small>« Un vélo rouge »</small></div>
        <div class="w-label" id="lb-scan">Lue : <b>vélo rouge</b><small>12 rue des Lilas</small></div>
        <div class="w-label" id="lb-gift">Colis de <b>Léa</b></div>
        <div class="w-label" id="lb-addr">12 rue des Lilas</div>
        <div class="w-label" id="lb-meter">Le dernier <b>mètre</b></div>
      </div>
      <div id="w-flood"></div>
    </div>

    <script>
      (function () {
        var root = document.getElementById("world");
        var duration = parseFloat(root.dataset.duration) || 38.4;
        var clock = { t: 0 };
        var host = { duration: duration, clock: clock, render: null };
        window.__pnWorld = host;
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["world"] = new Promise(function (resolve) {
          host.ready = resolve;
        });
        var tl = gsap.timeline({ paused: true });
        tl.to(clock, {
          t: duration,
          duration: duration,
          ease: "none",
          onUpdate: function () {
            if (host.render) host.render(clock.t);
          },
        });
        window.__timelines = window.__timelines || {};
        window.__timelines["world"] = tl;
      })();
    </script>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.184.0/+esm";

      const host = window.__pnWorld;
      try {
        await document.fonts.load('800 120px "Outfit"');
        await document.fonts.load('600 30px "Outfit"');
      } catch (e) {
        /* canvas text falls back to the sans-serif face */
      }

      // ---------- helpers ----------
      const clamp01 = (x) => Math.min(1, Math.max(0, x));
      const lerp = (a, b, u) => a + (b - a) * u;
      const E = {
        none: (u) => u,
        inOut: (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2),
        in3: (u) => u * u * u,
        out3: (u) => 1 - Math.pow(1 - u, 3),
        expo: (u) => (u >= 1 ? 1 : 1 - Math.pow(2, -10 * u)),
        quad: (u) => u * u,
      };
      const seg = (t, a, b, ease = E.inOut) => ease(clamp01((t - a) / (b - a)));
      // closed-form damped spring 0 → 1 (damping ratio ~0.5)
      const spring = (t, a, dur = 0.7) => {
        const u = (t - a) / dur;
        if (u <= 0) return 0;
        if (u >= 1) return 1;
        return 1 - Math.exp(-6 * u) * Math.cos(11 * u);
      };
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rnd = mulberry32(2412);

      // ---------- renderer / camera ----------
      const W = 1920,
        H = 1080;
      const canvas = document.getElementById("w-canvas");
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
        preserveDrawingBuffer: true,
      });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap;

      const scene = new THREE.Scene();
      const V = 10;
      const camera = new THREE.OrthographicCamera((-V * W) / H, (V * W) / H, V, -V, 0.1, 500);
      const ISO = new THREE.Vector3(1, 1, 1).normalize();

      const hemi = new THREE.HemisphereLight(0x9db8e6, 0x2c3a5c, 1.55);
      scene.add(hemi);
      const sun = new THREE.DirectionalLight(0xd9e6ff, 1.9);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.bias = -0.0006;
      sun.shadow.normalBias = 0.03;
      sun.shadow.radius = 3;
      scene.add(sun, sun.target);
      const fill = new THREE.DirectionalLight(0xffc89a, 0.35);
      fill.position.set(10, 6, 14);
      scene.add(fill);

      // ---------- materials ----------
      const matCache = new Map();
      function M(color, opts = {}) {
        const key = color + JSON.stringify(opts);
        if (!opts.unique && matCache.has(key)) return matCache.get(key);
        const m = new THREE.MeshLambertMaterial({ color, flatShading: true, ...opts.p });
        if (opts.emissive) {
          m.emissive = new THREE.Color(opts.emissive);
          m.emissiveIntensity = opts.ei ?? 1;
        }
        if (opts.fade) {
          m.transparent = true;
          m.opacity = 1;
        }
        if (!opts.unique) matCache.set(key, m);
        return m;
      }
      const C = {
        red: "#d7263d",
        darkred: "#9e1b2e",
        gold: "#f2b33d",
        green: "#1f6f5c",
        green2: "#185a4b",
        snow: "#f4f7fb",
        snow2: "#e3eaf3",
        earth: "#6e4f4a",
        earth2: "#57403d",
        road: "#c9d3e0",
        cream: "#f3e3c3",
        wood: "#c98b5b",
        brick: "#a8473a",
        skin: "#f2c9a8",
        brown: "#9a6b47",
        dark: "#2b2f3a",
        card: "#c9a27a",
        win: "#ffc861",
      };
      const winMat = new THREE.MeshLambertMaterial({ color: C.win, emissive: new THREE.Color("#ffb347"), emissiveIntensity: 0.95 });

      // ---------- geometry helpers ----------
      const boxG = new THREE.BoxGeometry(1, 1, 1);
      function box(w, h, d, mat, x = 0, y = 0, z = 0, parent = scene, shadow = true) {
        const m = new THREE.Mesh(boxG, typeof mat === "string" ? M(mat) : mat);
        m.scale.set(w, h, d);
        m.position.set(x, y, z);
        m.castShadow = shadow;
        m.receiveShadow = true;
        parent.add(m);
        return m;
      }
      function cone(r, h, mat, x, y, z, parent = scene, segs = 8) {
        const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, segs), typeof mat === "string" ? M(mat) : mat);
        m.position.set(x, y, z);
        m.castShadow = true;
        m.receiveShadow = true;
        parent.add(m);
        return m;
      }
      function cyl(rt, rb, h, mat, x, y, z, parent = scene, segs = 12) {
        const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, segs), typeof mat === "string" ? M(mat) : mat);
        m.position.set(x, y, z);
        m.castShadow = true;
        m.receiveShadow = true;
        parent.add(m);
        return m;
      }
      function sphere(r, mat, x, y, z, parent = scene, segs = 10) {
        const m = new THREE.Mesh(new THREE.SphereGeometry(r, segs, Math.max(6, segs - 2)), typeof mat === "string" ? M(mat) : mat);
        m.position.set(x, y, z);
        m.castShadow = true;
        m.receiveShadow = true;
        parent.add(m);
        return m;
      }
      function group(parent = scene, x = 0, y = 0, z = 0) {
        const g = new THREE.Group();
        g.position.set(x, y, z);
        parent.add(g);
        return g;
      }
      function edgesOf(mesh, parent, opacity = 0.55) {
        const lm = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 });
        const l = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry), lm);
        l.position.copy(mesh.position);
        l.rotation.copy(mesh.rotation);
        l.scale.copy(mesh.scale);
        parent.add(l);
        l.userData.max = opacity;
        return l;
      }

      // gable roof, ridge along x. Returns group (y=0 at eave).
      function gableRoof(w, d, rh, roofMat, gableMat, parent, snow = true) {
        const g = group(parent);
        const half = d / 2 + 0.3;
        const ang = Math.atan2(rh, d / 2);
        const slab = Math.hypot(half, rh + 0.3 * Math.tan(ang));
        const parts = [];
        for (const s of [-1, 1]) {
          const p = box(w + 0.5, 0.2, slab, roofMat, 0, rh / 2, (s * half) / 2, g);
          p.rotation.x = s * ang;
          parts.push(p);
          if (snow) {
            const sn = box(w + 0.42, 0.14, slab * 0.86, snowRoofMatFor(roofMat), 0, 0, 0, g);
            sn.rotation.x = s * ang;
            const nx = 0, ny = Math.cos(ang), nz = s * Math.sin(ang);
            sn.position.set(0, rh / 2 + ny * 0.16, (s * half) / 2 + nz * 0.16 - s * 0.05);
            parts.push(sn);
          }
        }
        const shape = new THREE.Shape();
        shape.moveTo(-d / 2, 0);
        shape.lineTo(d / 2, 0);
        shape.lineTo(0, rh);
        shape.closePath();
        const tri = new THREE.ExtrudeGeometry(shape, { depth: w - 0.02, bevelEnabled: false });
        tri.rotateY(Math.PI / 2);
        tri.translate(-(w - 0.02) / 2, 0, 0);
        const gm = new THREE.Mesh(tri, gableMat);
        gm.castShadow = true;
        gm.receiveShadow = true;
        g.add(gm);
        parts.push(gm);
        g.userData.parts = parts;
        return g;
      }
      const snowRoofMats = new Map();
      function snowRoofMatFor(roofMat) {
        if (roofMat.transparent) {
          if (!snowRoofMats.has(roofMat)) snowRoofMats.set(roofMat, M(C.snow, { unique: true, fade: true }));
          return snowRoofMats.get(roofMat);
        }
        return M(C.snow);
      }

      // ---------- islands ----------
      function island(cx, cz, w, d) {
        box(w, 3.2, d, C.earth, cx, -1.95, cz, scene, false);
        box(w + 0.3, 0.12, d + 0.3, C.earth2, cx, -3.5, cz, scene, false);
        const top = box(w + 0.4, 0.42, d + 0.4, C.snow, cx, -0.21, cz, scene, false);
        top.receiveShadow = true;
        // snow drips over the edge
        for (let i = 0; i < 26; i++) {
          const side = i % 2;
          const k = rnd();
          const len = 0.4 + rnd() * 0.9;
          if (side) box(0.5 + rnd(), len, 0.2, C.snow, cx - w / 2 + k * w, -0.42 - len / 2 + 0.1, cz + d / 2 + 0.22, scene, false);
          else box(0.2, len, 0.5 + rnd(), C.snow, cx + w / 2 + 0.22, -0.42 - len / 2 + 0.1, cz - d / 2 + k * d, scene, false);
        }
      }

      // ---------- props ----------
      function pine(x, z, s = 1, parent = scene) {
        const g = group(parent, x, 0, z);
        cyl(0.12 * s, 0.16 * s, 0.6 * s, C.brown, 0, 0.3 * s, 0, g, 6);
        const tiers = [
          [1.0, 1.3, 1.0],
          [0.78, 1.15, 1.75],
          [0.55, 1.0, 2.45],
        ];
        tiers.forEach(([r, h, y], i) => {
          cone(r * s, h * s, i % 2 ? C.green2 : C.green, 0, y * s, 0, g, 7);
          cone(r * s * 0.45, h * s * 0.4, C.snow, 0, (y + h * 0.33) * s, 0, g, 7);
        });
        return g;
      }
      function lamp(x, z) {
        const g = group(scene, x, 0, z);
        cyl(0.06, 0.08, 2.2, C.dark, 0, 1.1, 0, g, 6);
        box(0.34, 0.3, 0.34, winMat, 0, 2.3, 0, g);
        box(0.44, 0.08, 0.44, C.dark, 0, 2.48, 0, g);
        return g;
      }
      function snowman(x, z, parent = scene) {
        const g = group(parent, x, 0, z);
        sphere(0.45, C.snow, 0, 0.42, 0, g);
        sphere(0.32, C.snow, 0, 1.05, 0, g);
        sphere(0.22, C.snow, 0, 1.5, 0, g);
        cone(0.05, 0.25, "#ff8a3d", 0.12, 1.5, 0.12, g, 6).rotation.set(Math.PI / 2, 0, -Math.PI / 4);
        box(0.5, 0.06, 0.5, C.dark, 0, 1.68, 0, g);
        box(0.3, 0.3, 0.3, C.dark, 0, 1.85, 0, g);
        box(0.62, 0.1, 0.12, C.red, 0, 1.3, 0, g).rotation.y = Math.PI / 4;
        return g;
      }
      function envelope(parent = scene, special = false) {
        const g = group(parent);
        box(0.9, 0.04, 0.62, special ? "#fff6e5" : "#ffffff", 0, 0, 0, g);
        // flap lines
        const flap = box(0.64, 0.045, 0.06, "#d9dee7", 0, 0.005, -0.12, g, false);
        flap.rotation.y = 0.5;
        const flap2 = box(0.64, 0.045, 0.06, "#d9dee7", 0, 0.005, -0.12, g, false);
        flap2.rotation.y = -0.5;
        cyl(0.09, 0.09, 0.06, special ? C.gold : C.red, 0, 0.02, 0.02, g, 10);
        return g;
      }
      function giftBox(s, color, ribbon, parent = scene) {
        const g = group(parent);
        box(s, s * 0.82, s, color, 0, (s * 0.82) / 2, 0, g);
        box(s * 1.02, s * 0.84, s * 0.18, ribbon, 0, (s * 0.82) / 2, 0, g);
        box(s * 0.18, s * 0.84, s * 1.02, ribbon, 0, (s * 0.82) / 2, 0, g);
        const bow = group(g, 0, s * 0.84, 0);
        sphere(s * 0.16, ribbon, s * 0.13, s * 0.08, 0, bow, 8).scale.set(1.3, 0.8, 0.7);
        sphere(s * 0.16, ribbon, -s * 0.13, s * 0.08, 0, bow, 8).scale.set(1.3, 0.8, 0.7);
        sphere(s * 0.08, ribbon, 0, s * 0.06, 0, bow, 8);
        g.userData.bow = bow;
        return g;
      }
      function cardboard(s, parent = scene) {
        const g = group(parent);
        box(s, s * 0.82, s, C.card, 0, (s * 0.82) / 2, 0, g);
        box(s * 1.01, s * 0.06, s * 0.2, "#b08d63", 0, s * 0.82, 0, g);
        return g;
      }
      function elf(x, z, rot, parent) {
        const g = group(parent, x, 0, z);
        g.rotation.y = rot;
        cone(0.26, 0.62, "#2e8b57", 0, 0.31, 0, g, 9);
        box(0.42, 0.06, 0.42, C.dark, 0, 0.28, 0, g).rotation.y = Math.PI / 8;
        const head = group(g, 0, 0.72, 0);
        sphere(0.16, C.skin, 0, 0, 0, head);
        sphere(0.05, C.skin, 0.13, 0.0, 0.1, head, 6);
        sphere(0.05, C.skin, -0.13, 0.0, -0.1, head, 6);
        const hat = cone(0.15, 0.38, C.red, 0, 0.24, 0, head, 9);
        hat.rotation.z = -0.25;
        sphere(0.06, C.snow, -0.09, 0.44, 0, head, 6);
        box(0.34, 0.07, 0.34, C.snow, 0, 0.1, 0, head);
        g.userData.head = head;
        return g;
      }

      // ---------- house ----------
      const wallColors = ["#f3e3c3", "#e9d2c0", "#cfe0e8", "#f1d3a4", "#e8c7c7", "#d8e4d0"];
      const roofColors = ["#b8323f", "#3c6e8f", "#7a4a3a", "#2f5d50", "#b8323f", "#8a3b52"];
      const houses = [];
      function house(x, z, opts = {}) {
        const w = opts.w ?? 3.6 + rnd() * 0.8;
        const d = opts.d ?? 3.4 + rnd() * 0.8;
        const h = opts.h ?? 2.4 + rnd() * 0.9;
        const rh = opts.rh ?? 1.4 + rnd() * 0.5;
        const ci = Math.floor(rnd() * wallColors.length);
        const g = group(scene, x, 0, z);
        const rotY = opts.rot ?? (rnd() < 0.5 ? 0 : Math.PI / 2);
        g.rotation.y = rotY;
        box(w, h, d, wallColors[ci], 0, h / 2, 0, g);
        const roof = gableRoof(w, d, rh, M(roofColors[ci]), M(wallColors[ci]), g);
        roof.position.y = h;
        // chimney
        const cx = w * 0.22,
          cz = -d * 0.2;
        const ctop = h + rh + 0.5;
        box(0.62, ctop - h, 0.62, C.brick, cx, h + (ctop - h) / 2, cz, g);
        box(0.74, 0.16, 0.74, C.snow, cx, ctop + 0.05, cz, g);
        box(0.4, 0.05, 0.4, "#1a1414", cx, ctop + 0.14, cz, g, false);
        // windows on all faces, door on +z
        const wy = h * 0.55;
        for (const s of [-1, 1]) {
          box(0.55, 0.62, 0.06, winMat, -w * 0.25, wy, s * (d / 2 + 0.01), g, false);
          box(0.55, 0.62, 0.06, winMat, w * 0.25, wy, s * (d / 2 + 0.01), g, false);
          box(0.06, 0.62, 0.55, winMat, s * (w / 2 + 0.01), wy, 0, g, false);
        }
        box(0.7, 1.15, 0.08, C.darkred, 0, 0.58, d / 2 + 0.03, g, false);
        g.updateMatrixWorld(true);
        const top = new THREE.Vector3(cx, ctop + 0.15, cz).applyMatrix4(g.matrixWorld);
        const hs = { g, x, z, top, h, rh };
        houses.push(hs);
        return hs;
      }

      // ================= TOWN =================
      island(0, 0, 40, 40);
      // roads
      for (const r of [-12, 0, 12]) {
        box(40, 0.04, 1.9, C.road, 0, 0.02, r, scene, false);
        box(1.9, 0.045, 40, C.road, r, 0.02, 0, scene, false);
      }
      for (const a of [-12, 0, 12]) for (const b of [-12, 0, 12]) if (rnd() < 0.7) lamp(a + 1.2, b + 1.2);

      const LH = new THREE.Vector3(3, 0, 3); // Léa's house
      const cells = [-15, -9, -3, 3, 9, 15];
      const cellHouse = {};
      for (const cz of cells)
        for (const cx of cells) {
          if (cx === 3 && cz === 3) continue;
          if ((cx === 9 && cz === 3) || (cx === 3 && cz === 9) || (cx === 9 && cz === 9)) {
            // Léa's garden side stays open so the camera can see the mailbox and the cutaway
            if (cx === 9 && cz === 9) {
              pine(cx + 1.5, cz + 1.5, 0.7);
              snowman(cx - 0.5, cz - 0.2);
            }
            continue;
          }
          const k = rnd();
          if (k < 0.8) {
            cellHouse[cx + "," + cz] = house(cx + (rnd() - 0.5) * 0.6, cz + (rnd() - 0.5) * 0.6);
            if (rnd() < 0.5) pine(cx + 2.3, cz - 2.2, 0.55 + rnd() * 0.25);
          } else {
            pine(cx - 1, cz - 1, 0.9);
            pine(cx + 1.2, cz + 0.4, 0.7);
            pine(cx - 0.4, cz + 1.6, 0.6);
          }
        }
      snowman(-6.2, 6.4);
      snowman(13.8, -6.3);
      for (let i = 0; i < 14; i++) {
        const a = rnd() * Math.PI * 2;
        const r = 19.2;
        const px = Math.max(-19.3, Math.min(19.3, Math.cos(a) * r));
        const pz = Math.max(-19.3, Math.min(19.3, Math.sin(a) * r));
        pine(px, pz, 0.6 + rnd() * 0.4);
      }

      // ---------- Léa's hero house (cutaway) ----------
      const lea = group(scene, LH.x, 0, LH.z);
      const LW = 4.6,
        LD = 4.6,
        LHt = 3.0,
        LRH = 1.8;
      const leaWall = M(C.cream);
      const ghostMats = [];
      function gmat(color) {
        const m = M(color, { unique: true, fade: true });
        ghostMats.push(m);
        return m;
      }
      box(LW, 0.12, LD, C.wood, 0, 0.06, 0, lea);
      // back walls

          });
          dd.position.y = fly * (Math.sin(t * 6.5 + ph) * 0.12 + 0.15 * (i >> 1));
          dd.userData.head.rotation.z = fly * Math.sin(t * 6.5 + ph) * 0.1;
        });
        sleigh.updateMatrixWorld(true);
        // ---- dawn ----
        const d = seg(t, 33.9, 34.9, E.inOut);
        dawn.style.opacity = d.toFixed(3);
        hemi.color.copy(nightHemi).lerp(dawnHemi, d);
        hemi.groundColor.copy(nightGround).lerp(dawnGround, d);
        hemi.intensity = lerp(1.55, 1.9, d);
        sun.color.copy(nightSun).lerp(dawnSun, d);
        sun.intensity = lerp(1.9, 2.3, d);
        winMat.emissiveIntensity = lerp(0.95, 0.25, d);
        backWin.color.copy(nightWin).lerp(dawnWin, d);
        backWin.emissive.copy(new THREE.Color("#3a64a8")).lerp(new THREE.Color("#ffb38a"), d);
        flood.style.opacity = seg(t, 38.12, 38.36, E.quad).toFixed(3);

        // ---- mailbox + Léa's letter ----
        const ins = seg(t, 0.25, 1.15, E.inOut);
        flagPivot.rotation.x = -(1 - spring(t, 1.25, 0.8)) * 1.45;
        if (t < 1.2) {
          leaLetter.visible = true;
          leaLetter.position.set(MB.x, 1.3, MB.z + lerp(1.25, 0.05, ins));
          leaLetter.rotation.set(Math.PI / 2, 0, 0);
          leaLetter.scale.setScalar(0.66);
        } else if (t < 3.4) {
          leaLetter.visible = false;
        } else if (t < 10.25) {
          leaLetter.visible = true;
          leaLetter.scale.setScalar(1.15);
          if (t < 4.7) {
            const u = seg(t, 3.4, 4.7, E.out3);
            leaLetter.position.lerpVectors(MB.clone().add(v3(0, 1.75, 0)), LETTER_UP, u);
            leaLetter.rotation.set(Math.PI / 2 * (1 - u), u * 4.2, 0);
          } else {
            const u = seg(t, 4.7, 10.25, (x) => x * x * (3 - 2 * x));
            bez(LETTER_UP, LETTER_UP.clone().lerp(FUN, 0.5).add(v3(0, 13, 0)), FUN, u, leaLetter.position);
            leaLetter.rotation.set(Math.sin(t * 2.1) * 0.5, 4.2 + (t - 4.7) * 1.3, Math.cos(t * 1.7) * 0.35);
          }
        } else leaLetter.visible = false;

        // ---- letters stream ----
        for (const L of letters) {
          if (t < L.ts || t > L.te) {
            L.e.visible = false;
            continue;
          }
          L.e.visible = true;
          const u = (t - L.ts) / (L.te - L.ts);
          const ue = u * u * (3 - 2 * u);
          tmp2.copy(L.from).lerp(FUN, 0.5).add(v3(0, 12, 0));
          if (u < 0.12) {
            const k = E.out3(u / 0.12);
            L.e.position.copy(L.from).add(v3(0, k * 1.6, 0));
          } else {
            bez(L.from.clone().add(v3(0, 1.6, 0)), tmp2, FUN, (ue - 0.0) , L.e.position);
          }
          L.e.rotation.set(Math.sin(t * 2 + L.spin) * 0.6, t * L.spin, Math.cos(t * 1.3 + L.spin) * 0.4);
          const s = Math.min(1, u / 0.06) * (1 - clamp01((u - 0.96) / 0.04));
          L.e.scale.setScalar(1.1 * s);
        }

        // ---- HQ cutaway ----
        const lift = seg(t, 13.0, 14.0, E.in3);
        hqRoof.position.y = FH + 0.25 + lift * 14;
        hqRoof.visible = lift < 0.999;
        const ro = 1 - seg(t, 13.35, 14.0, E.none);
        roofFadeMats.forEach((m) => {
          m.opacity = ro;
          m.depthWrite = ro > 0.98;
        });
        const fold = seg(t, 13.2, 14.1, E.inOut);
        fHX.rotation.z = -fold * Math.PI * 0.5;
        fHZ.rotation.x = fold * Math.PI * 0.5;
        // the roof returns for the departure (hidden from camera anyway)
        // elves bob
        elves.forEach((el, i) => {
          el.userData.head.rotation.z = Math.sin(t * 3 + i) * 0.12;
          el.position.y = Math.abs(Math.sin(t * 4 + i * 1.7)) * 0.06;
        });
        // scanner + sorter lamps
        const lbx = leaBeltX(t);
        const scanHit = t > 14 && t < 16.8 ? Math.exp(-Math.pow((lbx - scanX) / 0.35, 2)) : 0;
        scanMat.emissiveIntensity = 0.15 + 2.2 * scanHit;
        sorterLamps.forEach((m, i) => (m.emissiveIntensity = 0.25 + (Math.sin(t * 6 + i * 2) > 0.3 ? 1.2 : 0) + (t > 16.5 && t < 17.3 ? 1.5 : 0)));
        // belt A letters
        beltLetters.forEach((e, i) => {
          const x = -7.0 + ((t * 1.6 + i * 0.78) % 7.8);
          e.position.set(x, 0.92, BAZ + Math.sin(i * 3.1) * 0.2);
          e.rotation.y = Math.sin(i * 2.3) * 0.5;
          const near = t > 13.5 && t < 17 && Math.abs(x - lbx) < 0.8;
          e.visible = x < 0.55 && !near;
        });
        leaBeltLetter.visible = t > 13.8 && lbx < 0.6;
        leaBeltLetter.position.set(Math.max(-7, lbx), 0.93, BAZ);
        leaBeltLetter.rotation.y = 0.1;
        // belt B boxes
        const lgx = leaGiftX(t);
        beltBoxes.forEach((b, i) => {
          const x = -7.0 + ((t * 2.0 + i * 1.85) % 14.8);
          const near = t > 16.8 && t < 21 && Math.abs(x - lgx) < 1.3;
          const inMachine = Math.abs(x) < 1.05;
          b.raw.position.set(x, 0.89, BBZ);
          b.wr.position.set(x, 0.89, BBZ);
          b.raw.visible = !near && x < 0;
          b.wr.visible = !near && x >= 0;
          b.raw.rotation.y = b.wr.rotation.y = 0.1 * Math.sin(i);
          if (inMachine) {
            b.raw.visible = b.wr.visible = false;
          }
        });

        // ---- Léa's gift journey ----
        leaRaw.visible = leaGift.visible = false;
        leaRaw.position.set(F.x + lgx, 0.89, F.z + BBZ);
        if (t > 16.8 && t < 19.65) {
          leaRaw.visible = Math.abs(lgx) > 1.0 || lgx < -1.0;
          leaRaw.position.set(F.x + lgx, 0.89, F.z + BBZ);
          leaRaw.rotation.y = 0;
        }
        if (t >= 19.65 && t < 21.55) {
          leaGift.visible = lgx > 0.95 || t > 20.2;
          let p;
          if (t < 20.6) {
            leaGift.position.set(F.x + lgx, 0.89, F.z + BBZ);
          } else {
            // arc into the sack
            const u = seg(t, 20.6, 21.5, E.inOut);
            const a = FP(leaGiftX(20.6), 0.89, BBZ);
            const b = sleighBody.localToWorld(v3(-0.8, 1.6, 0));
            bez(a, a.clone().lerp(b, 0.5).add(v3(0, 4.5, 0)), b, u, leaGift.position);
            leaGift.rotation.y = u * 3.2;
            leaGift.scale.setScalar(1 - u * 0.55);
          }
          const bow = spring(t, 20.25, 0.8);
          leaGift.userData.bow.scale.setScalar(Math.max(0.001, bow));
          if (t < 20.6) leaGift.scale.setScalar(1), (leaGift.rotation.y = 0);
        }
        if (t >= 28.5) {
          leaGift.visible = true;
          leaGift.userData.bow.scale.setScalar(1);
          const top = LP(CHX, CHTOP + 0.15, CHZ);
          if (t < 29.05) {
            const u = seg(t, 28.5, 29.05, E.inOut);
            const a = sleighBody.localToWorld(v3(-0.8, 1.6, 0));
            bez(a, a.clone().lerp(top, 0.5).add(v3(0, 1.6, 0)), top.clone().add(v3(0, 0.3, 0)), u, leaGift.position);
            leaGift.scale.setScalar(lerp(0.45, 0.62, u));
            leaGift.rotation.y = u * 2;
          } else if (t < 30.05) {
            const u = seg(t, 29.05, 30.05, E.quad);
            leaGift.position.set(top.x, lerp(top.y + 0.3, 0.22, u), top.z);
            leaGift.scale.setScalar(0.62);
            leaGift.rotation.y = 2 + u * 1.2;
          } else {
            const u1 = seg(t, 30.05, 30.45, E.out3);
            const u2 = seg(t, 30.45, 30.95, E.inOut);
            const mouth = LP(CHX + 0.95, 0.22, CHZ);
            const a = LP(CHX, 0.22, CHZ);
            if (t < 30.45) leaGift.position.lerpVectors(a, mouth, u1);
            else {
              leaGift.position.lerpVectors(mouth, GIFT_FINAL, u2);
              leaGift.position.y += Math.sin(u2 * Math.PI) * 0.55;
            }
            leaGift.scale.setScalar(lerp(0.62, 0.7, u2));
            leaGift.rotation.y = lerp(3.2, Math.PI * 2, u2);
          }
        }
        // puff of soot at the hearth
        const pu = clamp01((t - 30.05) / 0.9);
        puffMat.opacity = t > 30.05 ? (1 - pu) * 0.75 : 0;
        puffs.forEach((P, i) => {
          P.p.visible = t > 30.05 && t < 31;
          const r = P.r * (0.4 + E.out3(pu) * 1.6);
          P.p.position.copy(LP(CHX + 1.0 + Math.cos(P.a) * r * 0.6, 0.35 + Math.abs(Math.sin(P.a)) * r * 0.9 + pu * 0.4, CHZ + Math.sin(P.a) * r));
          P.p.scale.setScalar(0.6 + E.out3(pu) * 1.6);
        });

        // ---- Léa's house cutaway ----
        const cf = seg(t, 27.85, 28.75, E.inOut);
        hingeX.rotation.z = -cf * Math.PI * 0.5;
        hingeZ.rotation.x = cf * Math.PI * 0.5;
        const gr = 1 - 0.86 * seg(t, 27.9, 28.5, E.inOut);
        ghostMats.forEach((m) => {
          m.opacity = gr;
          m.depthWrite = gr > 0.98;
        });
        const chf = 1 - seg(t, 28.2, 28.8, E.inOut);
        chimFrontMat.opacity = chf;
        chimFrontMat.depthWrite = chf > 0.98;
        roofEdges.forEach((l) => (l.material.opacity = (1 - gr) / 0.86 * l.userData.max));
        chimEdges.forEach((l) => (l.material.opacity = (1 - chf) * l.userData.max));
        // fire + tree
        flames.forEach((f, i) => {
          f.scale.y = 0.8 + 0.35 * Math.abs(Math.sin(t * 9 + i * 1.9));
          f.scale.x = f.scale.z = 0.9 + 0.15 * Math.sin(t * 7 + i);
        });
        fireLight.intensity = t > 27.5 ? 2.2 + 0.4 * Math.sin(t * 11) : 0;
        treeLights.forEach((m, i) => (m.emissiveIntensity = 1.6 * seg(t, 30.95 + i * 0.045, 31.1 + i * 0.045, E.out3) * (0.85 + 0.15 * Math.sin(t * 5 + i))));
        star.material.emissiveIntensity = 1.2 * seg(t, 31.7, 31.95, E.out3);
        star.scale.setScalar(1 + 0.6 * (spring(t, 31.7, 0.7) - seg(t, 31.7, 32.4)));

        // ---- route + drops ----
        const rd = seg(t, 23.0, 24.7, E.inOut);
        routeMesh.visible = t > 23.0 && t < 28.6;
        routeGeo.setDrawRange(0, Math.floor((rd * ROUTE_TOTAL) / 3) * 3);
        const ru = t > 23.9 ? routeU(t) : 0;
        const ruAt = (u) => {
          // invert routeU numerically (monotonic)
          let lo = 23.9,
            hi = 27.9;
          for (let k = 0; k < 24; k++) {
            const mid = (lo + hi) / 2;
            if (routeU(mid) < u) lo = mid;
            else hi = mid;
          }
          return lo;
        };
        stops.forEach((S) => {
          if (S.t === undefined) S.t = ruAt(S.u);
          const td = S.t;
          const du = clamp01((t - td) / 0.4);
          S.drop.visible = t > td && t < td + 0.4;
          S.drop.position.set(lerp(S.hs.top.x, S.hs.top.x, du), lerp(ROUTE_Y - 0.6, S.hs.top.y, du * du), S.hs.top.z);
          const pop = spring(t, td + 0.38, 0.7);
          const out = 1 - seg(t, 27.4, 27.8, E.in3);
          S.sp.visible = pop > 0.001 && out > 0.001 && t < 28;
          S.sp.position.set(S.hs.top.x, S.hs.top.y + 1.4, S.hs.top.z);
          S.sp.scale.setScalar(Math.max(0.001, pop * out * 2.2));
        });

        // ---- snow around the camera target ----
        const sx = (V * W) / H / zoom + 2,
          sy = V / zoom + 2;
        const right = v3(1, 0, -1).normalize(),
          up = v3(-1, 2, -1).normalize();
        for (let i = 0; i < SN; i++) {
          const bx = snowBase[i * 3],
            by = snowBase[i * 3 + 1],
            bz = snowBase[i * 3 + 2];
          const fall = (by - t * (0.05 + bz * 0.04) * zoom * 0.5 + 10) % 1;
          const sway = Math.sin(t * 1.3 + i) * 0.01;
          const px = (((bx + sway) % 1) - 0.5) * 2 * sx;
          const py = (fall - 0.5) * 2 * sy;
          tmp.copy(camT).addScaledVector(right, px).addScaledVector(up, py).addScaledVector(ISO, 8 + bz * 20);
          snowPos[i * 3] = tmp.x;
          snowPos[i * 3 + 1] = tmp.y;
          snowPos[i * 3 + 2] = tmp.z;
        }
        snowGeo.attributes.position.needsUpdate = true;
        snowMat.size = 4 + Math.min(4, zoom * 1.2);
        snowMat.opacity = 0.85 * (1 - 0.6 * d);

        renderer.render(scene, camera);
        drawLabels(t);
      };
      host.render(host.clock.t);
      host.ready();
    </script>
  </body>
</html>
