          (i === 0 ? '<div class="abs badge" id="badge-0">Le plus proche</div>' : "");

      var tl = gsap.timeline({ paused: true });

      gsap.set("#ap-iris", { clipPath: "circle(0px at 646px 727px)" });
      // camera helper: put screen point (sx, sy) at frame point (fx, fy) with zoom Z

        tl.to("#finger", { scale: 1, duration: 0.18, ease: "power2.out" }, T(at) + 0.06);
        tl.to("#finger", { opacity: 0, duration: 0.2 }, T(at) + 0.3);
